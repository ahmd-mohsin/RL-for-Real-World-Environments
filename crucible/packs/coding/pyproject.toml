[project]
name = "crucible-pack-coding"
version = "0.3.0"
description = "Crucible domain pack: coding (MVP family: legacy GPU code migration)"
requires-python = ">=3.12"
dependencies = ["crucible>=0.1,<0.2", "pyyaml>=6"]

[project.entry-points."crucible.plugins"]
coding = "crucible_pack_coding:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible_pack_coding"]

[tool.hatch.build.targets.wheel.force-include]
"pack.yaml" = "crucible_pack_coding/_pack/pack.yaml"
"README.md" = "crucible_pack_coding/_pack/README.md"
"families" = "crucible_pack_coding/_pack/families"
