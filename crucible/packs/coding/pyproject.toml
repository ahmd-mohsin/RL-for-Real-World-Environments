[project]
name = "crucible-pack-coding"
version = "0.1.0"
description = "Crucible domain pack: coding (MVP family: legacy GPU code migration)"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."crucible.plugins"]
coding = "crucible_pack_coding:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible_pack_coding"]
