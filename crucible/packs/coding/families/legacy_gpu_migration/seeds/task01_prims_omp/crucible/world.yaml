schema_version: crucible.world/v1
world: coding/legacy_gpu_migration/task01_prims_omp
description: 'tsr-prims: CUDA -> OpenMP target offload'
backend: harbor
backend_params:
  task_dir: ../../../../../../../migration_tasks/task01_prims_omp
  docker_image: ahmedmohsin/task01-prims-omp:v1
  gpu_host: lab5090
apps:
- id: app
  template: coding/git_repo
  state:
    adapter: fs_git
    params:
      root: /app
      exclude:
      - '**/build*/**'
      - build*/**
      - install*/**
      - '**/__pycache__/**'
      - '*.egg-info/**'
      - '**/*.egg-info/**'
  params:
    shell: true
  resources:
    gpus: 0
  description: the repository to migrate
- id: gpu
  template: coding/gpu_toolchain
  state:
    adapter: process
    params:
      cwd: /app
  params: {}
  resources:
    cpus: 16.0
    memory_mb: 32768
    gpus: 1
    gpu_arch: sm_89
actors:
- id: agent
  kind: policy
  tools:
  - app.*
  grounded_on: []
  params: {}
events: []
policies: []
network: no-network
seed: 0
