[project]
name = "crucible-pack-finance_ap"
version = "0.1.0"
description = "A Crucible domain pack"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."crucible.plugins"]
finance_ap = "crucible_pack_finance_ap:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible_pack_finance_ap"]
