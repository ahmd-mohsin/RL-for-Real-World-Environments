[project]
name = "crucible-pack-__PACK_NAME__"
version = "0.1.0"
description = "A Crucible domain pack"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."crucible.plugins"]
__PACK_NAME__ = "__PACK_PKG__:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__PACK_PKG__"]
