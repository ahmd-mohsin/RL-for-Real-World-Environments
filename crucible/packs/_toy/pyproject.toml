[project]
name = "crucible-pack-toy"
version = "0.3.0"
description = "Crucible toy domain pack (helpdesk): keeps the core domain-agnostic; runs in CI on CPU"
requires-python = ">=3.12"
dependencies = ["crucible>=0.1,<0.2", "pyyaml>=6"]

[project.entry-points."crucible.plugins"]
toy = "crucible_pack_toy:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible_pack_toy"]

[tool.hatch.build.targets.wheel.force-include]
"pack.yaml" = "crucible_pack_toy/_pack/pack.yaml"
"README.md" = "crucible_pack_toy/_pack/README.md"
"data" = "crucible_pack_toy/_pack/data"
"worlds" = "crucible_pack_toy/_pack/worlds"
