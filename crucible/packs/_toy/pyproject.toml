[project]
name = "crucible-pack-toy"
version = "0.1.0"
description = "Crucible toy domain pack (helpdesk): keeps the core domain-agnostic; runs in CI on CPU"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."crucible.plugins"]
toy = "crucible_pack_toy:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible_pack_toy"]
