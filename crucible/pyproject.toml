[project]
name = "crucible"
version = "0.1.0"
description = "Workflow traces with expert signal -> dense-reward RL environments, frontier-hard tasks, step-level benchmarks"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "ahmd-mohsin" }]
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.12",
  "pyyaml>=6.0",
  "tomli-w>=1.0",
  "httpx>=0.27",
  "rich>=13",
  "click>=8.1",
  # RLM kernel snapshots (M16 §3.4; BSD-3-Clause): pure Python, pushed into the Docker kernel as a zip
  "dill>=0.3.8",
]

[project.optional-dependencies]
# MCP serving for Apps (MiMo sidecar runtime). mcp 1.x, as agentenv requires.
mcp = ["mcp>=1.10,<2", "uvicorn>=0.30", "starlette>=0.40"]
# Harbor: task + trajectory models, sandbox environments, agents, jobs.
harbor = ["harbor"]
# agentenv: multi-app worlds (MCP / service DB / website / gateway clock + triggers), A2A agents.
agentenv = ["agentenv-framework", "agentenv-framework-protocol[agent]", "mcp>=1.10,<2", "psycopg2-binary>=2.9"]
# OpenEnv AgentWorldModel-1K worlds (generated FastAPI + SQLAlchemy services exposed via fastapi-mcp).
openenv-awm = ["fastapi>=0.110", "sqlalchemy>=2.0", "fastapi-mcp>=0.3", "huggingface-hub>=0.24", "mcp>=1.10,<2", "uvicorn>=0.30"]
# LLM-backed actors (OpenAI-compatible endpoints: OpenRouter, vLLM, SGLang).
llm = ["openai>=1.60"]
# M12 trainer side: losses, corrections, advantages, the reference trainer (CPU wheels locally; CUDA images on GPU hosts)
train = ["torch>=2.5", "numpy>=1.26", "safetensors>=0.4", "transformers>=4.56", "httpx>=0.27"]
# Evaluating workflow models and credit on public trajectory corpora (parquet), M5/M6 gates.
analysis = ["pyarrow>=15"]
# Control and simulators (M1 item 10): Gymnasium environments and spaces (classic control runs on numpy alone).
control = ["gymnasium>=1.0", "numpy>=1.26"]
# Remote environments over WebSocket (M1 item 9; OpenEnv's /ws protocol, no OpenEnv install needed).
remote = ["websockets>=12"]
# Single-turn answer checking (M1 item 2): symbolic math equivalence (Hugging Face math-verify, as NeMo-Gym and verifiers use).
answers = ["math-verify>=0.7"]
# Multi-node placement on Ray (M12-infra C, train.cluster.RayLauncher): per-node placement groups; optional.
ray = ["ray>=2.40"]
# Tinker (Thinking Machines) as trainer and sampler (train/bridges/tinker; Apache-2.0 SDK, imported lazily).
tinker = ["tinker>=0.34", "transformers>=4.56"]
# Observability (crucible.observe, swarm-pipeline/11): W&B runs/tables/artifacts offline (`wandb sync` later), Weave traces
# (replayed from local spans once a key exists), the W&B Reports API for the report template.
observe = ["wandb>=0.31", "weave>=0.53", "wandb-workspaces>=0.4"]
# verifiers v1 (prime-rl path). Pins mcp==2.0.0, so it cannot share an env with agentenv / mcp.
verifiers = ["verifiers"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.100",
  "import-linter>=2.1",
  "ruff>=0.16",
]

[project.scripts]
crucible = "crucible.cli.main:cli"

# agentenv plugin (research m11-m12/05 §4): agentenv loads these only when it is installed
[project.entry-points."agent_env.task_steps"]
crucible_world = "crucible.interop.agentenv.plugin.steps:CrucibleWorldStep"
crucible_verify = "crucible.interop.agentenv.plugin.steps:CrucibleVerifyStep"

# the crucible_world sandbox type: agentenv's teardown_run closes a run's World through it (plugin/steps.py, "Teardown")
[project.entry-points."agent_env.sandbox_providers"]
crucible_world = "crucible.interop.agentenv.plugin.steps:CrucibleWorldProvider"

[project.entry-points."agent_env.artifacts"]
crucible_ref = "crucible.interop.agentenv.plugin.artifacts:CrucibleRefArtifact"

[project.entry-points."agent_env.explorer_plugins"]
crucible = "crucible.studio.explorer:CrucibleExplorerPlugin"
crucible_labels = "crucible.factory.explorer:LabelsExplorerPlugin"  # M17: human ground-truth intake and labels

# verl imports this group on `import verl` (verl/__init__.py:55-75), in every Ray actor: the crucible_delta estimator and
# the crucible_agent agent loop (train/bridges/verl_plugin.py)
[project.entry-points."verl.plugins"]
crucible = "crucible.train.bridges.verl_plugin"

[project.entry-points."crucible.packs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible", "src/crucible_vf"]

[tool.uv]
conflicts = [
  [{ extra = "verifiers" }, { extra = "agentenv" }],
  [{ extra = "verifiers" }, { extra = "mcp" }],
  [{ extra = "verifiers" }, { extra = "openenv-awm" }],
]
# weave (extra observe) depends on cint, whose wheel installs a top-level `tests` package that shadows this repo's
# tests/ namespace (every `from tests.unit...` stops collecting); weave imports without it, so it is never installed.
override-dependencies = ["cint; sys_platform == 'never'"]

[tool.uv.workspace]
members = ["packs/coding", "packs/_toy"]

[dependency-groups]
packs = ["crucible-pack-coding", "crucible-pack-toy"]

[tool.uv.sources]
crucible = { workspace = true }  # the packs depend on crucible (M14 wheels); uv needs the root named as a source
crucible-pack-coding = { workspace = true }
crucible-pack-toy = { workspace = true }
harbor = { path = "../RL-Environments/06-frameworks-and-env-code/harbor-framework-harbor", editable = true }
agentenv-framework = { path = "../agentenv-framework", editable = true }
agentenv-framework-protocol = { path = "../agentenv-framework/packages/agentenv-protocol", editable = true }
verifiers = { path = "../RL-Environments/06-frameworks-and-env-code/primeintellect-ai-verifiers", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 200
extend-exclude = [".playwright-mcp", "data/cache", "packs/_template"]  # the template holds __PACK_PKG__ tokens

[tool.ruff.lint]
extend-select = ["TID251"]  # the banned APIs below

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# PyYAML's loaders keep the last of two equal keys (a second `network: public` wins): read documents through core (R-7)
"yaml.safe_load".msg = "use crucible.core.serialize.load_yaml, which refuses duplicate keys"
"yaml.safe_load_all".msg = "use crucible.core.serialize.load_yaml, which refuses duplicate keys"
"yaml.load".msg = "use crucible.core.serialize.load_yaml, which refuses duplicate keys"
"yaml.full_load".msg = "use crucible.core.serialize.load_yaml, which refuses duplicate keys"

[tool.ruff.lint.per-file-ignores]
# tests read back YAML that Crucible wrote; the ban guards loaders of authored files
"tests/**" = ["TID251"]
# ported code is kept as close to upstream as possible (THIRD_PARTY.md); only our [crucible]-tagged lines change
"src/crucible/_vendor/**" = ["BLE001", "SIM117", "EXE001", "FURB129", "F401"]
# Repo2RLEnv leak patterns are kept verbatim, flags included
"src/crucible/world/leaks.py" = ["FURB167"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests import shared helpers as ``tests.unit.<module>`` under plain ``pytest`` too (not only ``python -m pytest``)
asyncio_mode = "auto"
addopts = "-rfE"  # always name failing / erroring tests in the summary (a one-off flake must be identifiable)
asyncio_default_fixture_loop_scope = "function"
markers = [
  "docker: needs a local Docker daemon",
  "gpu: needs the lab RTX 5090 (CRUCIBLE_GPU_HOST)",
  "llm: calls a paid LLM endpoint (OPENROUTER_API_KEY)",
  "slow: takes more than ~30 s",
  "tinker: calls the paid Tinker service (TINKER_API_KEY); runs only with CRUCIBLE_TINKER_LIVE=1, never in CI",
]

[tool.importlinter]
root_packages = ["crucible"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only crucible.interop (and the studio and factory, above it) imports external RL frameworks; lower layers reach adapters through registry pointers"
type = "forbidden"
source_modules = [
  "crucible.core", "crucible.world", "crucible.actors", "crucible.connectors", "crucible.signals", "crucible.workflow",
  "crucible.credit", "crucible.verify", "crucible.runtime", "crucible.forge", "crucible.accept", "crucible.train", "crucible.bench",
  "crucible.observe",
]
forbidden_modules = ["harbor", "agent_env", "agentenv_protocol", "verifiers", "openenv", "nemo_gym"]
ignore_imports = ["crucible.runtime.record -> harbor"]  # a TYPE_CHECKING annotation only

[[tool.importlinter.contracts]]
name = "Core layers never import domain packs"
type = "forbidden"
source_modules = ["crucible.core", "crucible.world", "crucible.actors"]
forbidden_modules = ["crucible_pack_coding", "crucible_pack_toy"]

[[tool.importlinter.contracts]]
name = "Data modules (connectors, signals) depend only on core: no runtime, no frameworks, no packs"
type = "forbidden"
source_modules = ["crucible.connectors", "crucible.signals"]
forbidden_modules = ["crucible.world", "crucible.actors", "crucible.interop", "harbor", "agent_env", "verifiers", "openenv", "crucible_pack_coding", "crucible_pack_toy"]

[[tool.importlinter.contracts]]
name = "Only crucible.observe imports W&B and Weave: every result, graph and trace is logged (and redacted) through one module"
type = "forbidden"
source_modules = [
  "crucible.cli", "crucible.studio", "crucible.factory", "crucible.interop", "crucible.train", "crucible.bench", "crucible.accept", "crucible.forge",
  "crucible.runtime", "crucible.verify", "crucible.credit", "crucible.workflow", "crucible.connectors", "crucible.signals", "crucible.actors",
  "crucible.world", "crucible.core",
]
forbidden_modules = ["wandb", "weave", "wandb_workspaces"]
allow_indirect_imports = true  # through crucible.observe is the point

[[tool.importlinter.contracts]]
name = "Layering (M0 audit D3): a package may import only packages below it; siblings on one line are independent"
type = "layers"
layers = [
  "crucible.cli",
  "crucible.studio | crucible.factory",  # M17: the task factory sits beside the studio, above interop
  "crucible.interop",
  "crucible.train | crucible.bench",
  "crucible.accept",
  "crucible.forge",
  "crucible.runtime",
  "crucible.verify",
  "crucible.credit",
  "crucible.workflow",
  "crucible.observe",  # swarm-pipeline/11: W&B and Weave; reachable from the runtime up, uses only the redaction and core
  "crucible.connectors | crucible.signals",
  "crucible.actors",
  "crucible.world",
  "crucible.core",
]
