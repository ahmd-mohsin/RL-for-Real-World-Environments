schema_version = "1.3"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "rlsandbox/task01v2-tessera-omp"
description = "Port the Tessera hybrid splat + mesh renderer (~12k lines, 16 modules) from CUDA to OpenMP target offload: identical frames to the CUDA build, portable to the host device, concurrent multi-view rendering, and within 1.25-1.5x of the CUDA build (CUB sorts) per frame and per stage at 1080p."
authors = [{ name = "ahmd-mohsin" }]
keywords = ["cuda", "openmp", "offload", "kernel-migration", "performance", "gpu"]

[metadata]
task_id = "task01v2_tessera_omp"
display_title = "Port the Tessera renderer from CUDA to OpenMP target offload"
category = "kernel-migration"
language = "c++"
source = "synthetic (Tessera, single_task/repo), full repository"
difficulty = "hard"
gpu = "NVIDIA RTX 4090 (sm_89)"

[verifier]
network_mode = "no-network"
environment_mode = "separate"
timeout_sec = 3600.0
command = "bash /tests/test.sh"

[verifier.environment]
build_timeout_sec = 3600.0
cpus = 16
memory_mb = 32768
storage_mb = 20480
gpus = 1

[[verifier.collect]]
command = "cd /app && mkdir -p /logs/artifacts && git add -A -- . ':(exclude,glob)**/build*/**' ':(exclude)build*' && git diff --binary --cached base > /logs/artifacts/model.patch"
timeout_sec = 300.0

[agent]
network_mode = "no-network"
timeout_sec = 43200.0

[environment]
build_timeout_sec = 3600.0
dockerfile = "environment/Dockerfile"
os = "linux"
cpus = 16
memory_mb = 32768
storage_mb = 30720
gpus = 1
