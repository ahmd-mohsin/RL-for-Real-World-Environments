schema_version = "1.3"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "rlsandbox/task03-mdlite-pallas"
description = "Port mdlite, a CUDA C++ molecular dynamics engine (PME, LJ shift/switch, bonded terms, SHAKE/RATTLE, VV/BAOAB, CSVR, Berendsen/C-rescale, Philox RNG, fixed-point deterministic accumulation, bitwise restarts), to JAX + Pallas across a 3-repo workspace: same API, CLI and file formats, matching forces/energies/trajectories, bitwise determinism and restarts, pristine consumers, and per-case speed bars well below the CUDA engine."
authors = ["ahmd-mohsin"]
keywords = ["cuda", "jax", "pallas", "molecular-dynamics", "kernel-migration", "performance", "gpu"]

[metadata]
task_id = "task03_mdlite_pallas"
display_title = "Port the mdlite MD engine from CUDA C++ to JAX + Pallas"
category = "kernel-migration"
language = "python"
source = "mdlite, mdbuild, mdkit: original (written for this task)"
difficulty = "hard"
gpu = "NVIDIA RTX 5090 (sm_120)"

[verifier]
network_mode = "no-network"
environment_mode = "separate"
timeout_sec = 10800.0
command = "bash /tests/test.sh"

[verifier.environment]
build_timeout_sec = 3600.0
cpus = 16
memory_mb = 49152
storage_mb = 20480
gpus = 1

[[verifier.collect]]
command = "cd /workspace/mdlite && mkdir -p /logs/artifacts && git add -A -- . ':(exclude,glob)**/build*/**' ':(exclude)build*' ':(exclude)*.egg-info' ':(exclude)*.so' && git diff --binary --cached base > /logs/artifacts/model.patch"
timeout_sec = 300.0

[agent]
network_mode = "no-network"
timeout_sec = 43200.0

[environment]
build_timeout_sec = 3600.0
dockerfile = "environment/Dockerfile"
os = "linux"
cpus = 16
memory_mb = 49152
storage_mb = 30720
gpus = 1
