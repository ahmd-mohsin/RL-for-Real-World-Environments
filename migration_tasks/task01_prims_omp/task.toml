schema_version = "1.3"
artifacts = ["/logs/artifacts/model.patch"]

[task]
name = "rlsandbox/task01-prims-omp"
description = "Port the tsr-prims CUDA primitives library (scan, reduce, histogram, radix sort, bitonic sort, compaction) to OpenMP target offload, portable across GPU and host devices, within a per-primitive performance bound of the original CUDA on the same GPU."
authors = [{ name = "ahmd-mohsin" }]
keywords = ["cuda", "openmp", "offload", "kernel-migration", "performance", "gpu"]

[metadata]
task_id = "task01_prims_omp"
display_title = "Port tsr-prims from CUDA to OpenMP target offload"
category = "kernel-migration"
language = "c++"
source = "synthetic (Tessera, single_task/repo), tsr-prims subset"
difficulty = "hard"
gpu = "NVIDIA RTX 4090 (sm_89)"

[verifier]
network_mode = "no-network"
environment_mode = "separate"
timeout_sec = 3600.0
command = "bash /tests/test.sh"

[verifier.environment]
build_timeout_sec = 3600.0
cpus = 16
memory_mb = 32768
storage_mb = 20480
gpus = 1

[[verifier.collect]]
command = "cd /app && mkdir -p /logs/artifacts && git add -A -- . ':(exclude,glob)**/build*/**' ':(exclude)build*' && git diff --binary --cached base > /logs/artifacts/model.patch"
timeout_sec = 300.0

[agent]
network_mode = "no-network"
timeout_sec = 21600.0

[environment]
build_timeout_sec = 3600.0
dockerfile = "environment/Dockerfile"
os = "linux"
cpus = 16
memory_mb = 32768
storage_mb = 30720
gpus = 1
